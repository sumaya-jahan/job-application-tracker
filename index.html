<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Home -->
        <h2>Home</h2>

        <!-- Dashboard -->
        <section class="dashboard">

            <h1>Job Application Tracker</h1>

            <div class="stats">

                <div class="card">
                    <p>Total</p>
                    <h2 id="total-count">8</h2>
                </div>

                <div class="card">
                    <p>Interview</p>
                    <h2 id="interview-count">0</h2>
                </div>

                <div class="card">
                    <p>Rejected</p>
                    <h2 id="rejected-count">0</h2>
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
